{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "proxykube.fullname" . }}
  labels:
    {{- include "proxykube.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "proxykube.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: proxy, protocol: TCP}
      {{- with .Values.networkPolicy.proxyIngress }}
      from: {{ toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - {port: admin, protocol: TCP}
      {{- with .Values.networkPolicy.metricsIngress }}
      from: {{ toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - ports:
        - {protocol: TCP}
{{- end }}
