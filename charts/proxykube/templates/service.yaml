apiVersion: v1
kind: Service
metadata:
  name: {{ include "proxykube.fullname" . }}
  labels:
    {{- include "proxykube.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "proxykube.selectorLabels" . | nindent 4 }}
  ports:
    - name: proxy
      port: {{ .Values.service.proxyPort }}
      targetPort: proxy
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
